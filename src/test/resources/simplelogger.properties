# Configuraci�n del nivel de log para Healenium
#OFF: logging is disabled
#ERROR: only error messages are logged
#WARN: warning messages and errors are logged
#INFO: logs informational messages, warnings, and errors.
#DEBUG: detailed debugging information is logged
org.slf4j.simpleLogger.log.healenium=off

# Otras configuraciones opcionales de SLF4J
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.defaultLogLevel=info